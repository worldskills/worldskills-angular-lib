<p-autocomplete
  [ngModel]="value()"
  (ngModelChange)="onValueChange($event)"
  [suggestions]="suggestions()"
  (completeMethod)="onComplete($event.query)"
  (onBlur)="onBlur()"
  [optionLabel]="optionLabel()"
  [multiple]="multiple()"
  [minLength]="minLength()"
  [delay]="delay()"
  [dropdown]="dropdown()"
  [showClear]="showClear()"
  [forceSelection]="true"
  [disabled]="disabled()"
  [inputId]="inputId()"
  [placeholder]="placeholder() ?? ('ws_ui.search_select.placeholder' | translate)"
  [showEmptyMessage]="true"
  [emptyMessage]="'ws_ui.search_select.no_results' | translate"
  [fluid]="true"
  appendTo="body" />
