<div class="flex flex-col gap-4">

  <div class="flex items-center justify-between">
    <h4 class="font-semibold text-color text-sm">{{ 'ws_ui.awards.certificates' | translate }}</h4>
    <p-button
      [label]="'ws_ui.awards.add_certificate' | translate"
      icon="pi pi-plus"
      severity="secondary"
      size="small"
      (onClick)="addCertificate()"
    />
  </div>

  @if (certificates().length === 0) {
    <p class="text-sm text-color-secondary italic">{{ 'ws_ui.awards.no_awards' | translate }}</p>
  }

  @for (cert of certificates(); track $index) {
    <div class="rounded-lg border border-surface-200 bg-surface-0 p-4 flex flex-col gap-3">

      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold text-color-secondary uppercase tracking-wide">
          {{ 'ws_ui.awards.certificates' | translate }} #{{ $index + 1 }}
        </span>
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          size="small"
          (onClick)="removeCertificate($index)"
        />
      </div>

      <!-- Unique ID -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-color-secondary">
          {{ 'ws_ui.awards.certificate_unique_id' | translate }}
        </label>
        <div class="flex gap-2">
          <input
            pInputText
            class="flex-1 text-sm"
            [value]="cert.certificate_unique_id"
            (input)="updateField($index, 'certificate_unique_id', $any($event.target).value)"
          />
          <p-button
            [label]="'ws_ui.awards.generate_id' | translate"
            icon="pi pi-refresh"
            severity="secondary"
            size="small"
            (onClick)="generateId($index)"
          />
        </div>
      </div>

      <!-- Dropbox path -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-color-secondary">
          {{ 'ws_ui.awards.certificate_dropbox_path' | translate }}
        </label>
        <input
          pInputText
          class="w-full text-sm"
          [value]="cert.certificate_dropbox_path"
          (input)="updateField($index, 'certificate_dropbox_path', $any($event.target).value)"
        />
      </div>

      <!-- Certificate type -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-color-secondary">
          {{ 'ws_ui.awards.certificate_type' | translate }}
        </label>
        <p-select
          [options]="certificateTypeOptions"
          [ngModel]="cert.certificate_type"
          (ngModelChange)="updateField($index, 'certificate_type', $event)"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full text-sm"
        />
      </div>

    </div>
  }

</div>
