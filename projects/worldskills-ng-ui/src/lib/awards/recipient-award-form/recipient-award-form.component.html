<form [formGroup]="form" class="flex flex-col gap-5">

  <!-- Award selector -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-color">
      {{ 'ws_ui.awards.award' | translate }}
    </label>
    <p-select
      formControlName="award"
      [options]="awardGroups"
      optionLabel="name.text"
      optionGroupLabel="label"
      optionGroupChildren="items"
      [placeholder]="'ws_ui.awards.award' | translate"
      styleClass="w-full"
    />
  </div>

  <!-- Presented At -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-color">
      {{ 'ws_ui.awards.presented_at' | translate }}
    </label>
    <input
      pInputText
      type="number"
      formControlName="presented_at"
      class="w-full"
      [placeholder]="'ws_ui.awards.presented_at' | translate"
    />
  </div>

  <!-- Extra Information -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-color">
      {{ 'ws_ui.awards.extra_information' | translate }}
    </label>
    <textarea
      pTextarea
      formControlName="extra_information"
      rows="3"
      class="w-full resize-none"
    ></textarea>
  </div>

  <!-- Public Extra Information -->
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-color">
      {{ 'ws_ui.awards.public_extra_information' | translate }}
    </label>
    <textarea
      pTextarea
      formControlName="public_extra_information"
      rows="3"
      class="w-full resize-none"
    ></textarea>
  </div>

  <!-- Certificates section -->
  @if (certificateEnabled) {
    <div class="rounded-lg border border-surface-200 bg-surface-50 p-4">
      <ws-ng-ui-recipient-award-certificate-form
        [certificates]="localCertificates"
        (certificatesChange)="onCertificatesChange($event)"
      />
    </div>
  }

  <!-- Actions -->
  <div class="flex flex-wrap gap-2 justify-end pt-2 border-t border-surface-200">
    <p-button
      [label]="'ws_ui.awards.cancel' | translate"
      icon="pi pi-times"
      severity="secondary"
      (onClick)="onCancel()"
    />
    <p-button
      [label]="'ws_ui.awards.save' | translate"
      icon="pi pi-check"
      severity="primary"
      [disabled]="!form.value.award"
      (onClick)="onSave()"
    />
  </div>

</form>
