<div class="rounded-lg border border-surface-200 bg-surface-0 shadow-sm overflow-hidden">

  <!-- Header -->
  <div class="flex items-center justify-between px-4 py-3 border-b border-surface-200 bg-surface-50">
    <span class="font-semibold text-color text-sm">{{ title() }}</span>
    @if (downloadableResources().length > 0) {
      <p-button
        [label]="downloadAllLabel()"
        icon="pi pi-download"
        severity="secondary"
        size="small"
        [loading]="isZippingFiles()"
        (onClick)="downloadAll()"
      />
    }
  </div>

  <!-- Thumbnail grid -->
  <div class="p-4 max-h-80 overflow-y-auto">
    @if (resources().length > 0) {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        @for (item of resources(); track item.resource_id) {
          <ws-ng-ui-resource-thumbnail [resource]="item" />
        }
      </div>
    } @else {
      <p class="text-sm text-color-secondary text-center py-6">{{ 'ws_ui.resources.no_resources' | translate }}</p>
    }
  </div>

</div>
