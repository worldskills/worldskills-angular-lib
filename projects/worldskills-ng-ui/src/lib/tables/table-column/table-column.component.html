@if (clampLines()) {
  <!-- 3 lines fill the 64px virtual-scroll row: (4rem - 2 × 0.375rem cell padding - 1px border) / 3 -->
  <div #clamp class="line-clamp-3 leading-[calc((4rem-0.75rem-1px)/3)]" (mouseenter)="showFullText(clamp)">
    <ng-container [ngTemplateOutlet]="cell"></ng-container>
  </div>
} @else {
  <ng-container [ngTemplateOutlet]="cell"></ng-container>
}

<ng-template #cell>
  @if (renderer() && column().hasCellRendering) {
    <ng-container [ngTemplateOutlet]="renderer()!" [ngTemplateOutletContext]="{ $implicit: row(), column: column() }"></ng-container>
  } @else if (column().textRenderer) {
    {{ column().textRenderer!(row()) ?? '' }}
  } @else {
    {{ $any(row())[column().key] ?? '' }}
  }
</ng-template>
